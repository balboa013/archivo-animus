
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo Animus | La memoria de la Hermandad</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 7%;
      border-bottom: 1px solid #292929;
      text-align: center;
    }

    header h1 {
      margin: 0;
      letter-spacing: 5px;
      font-size: 28px;
    }

    header span {
      color: #a71920;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
      background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
        #171717;
    }

    .hero h2 {
      font-size: clamp(38px, 7vw, 76px);
      margin: 0 0 20px;
      letter-spacing: 3px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
      line-height: 1.7;
    }

    .hero a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 28px;
      background: #a71920;
      color: white;
      text-decoration: none;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .hero a:hover {
      background: #c62828;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ARCHIVO <span>ANIMUS</span></h1>
  </header>

  <main class="hero">
    <div>
      <h2>LA MEMORIA DE LA HERMANDAD</h2>
      <p>
        Una enciclopedia dedicada al universo de Assassin's Creed.
        <br>
        Explora su historia, sus personajes y sus leyendas.
      </p>
      <a href="#archivo">DESCUBRIR EL ARCHIVO</a>
    </div>
  </main>

  <footer id="archivo">
    ARCHIVO ANIMUS · LA HISTORIA NUNCA SE OLVIDA
  </footer>

</body>
</html>
